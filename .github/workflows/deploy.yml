name: Deploy

on:
  push:
    branches: [master]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Deploy jobs can't reference `secrets` in their `if:` condition, so we probe
  # for the host secrets here and expose booleans the deploy jobs can gate on.
  # An unconfigured target is skipped (green), not failed.
  config:
    runs-on: ubuntu-latest
    outputs:
      prod_ready: ${{ steps.check.outputs.prod_ready }}
      test_ready: ${{ steps.check.outputs.test_ready }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.DEPLOY_HOST }}" ]; then
            echo "prod_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "prod_ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DEPLOY_HOST not set — skipping production deploy."
          fi
          if [ -n "${{ secrets.TEST_DEPLOY_HOST }}" ]; then
            echo "test_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "test_ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TEST_DEPLOY_HOST not set — skipping test deploy."
          fi

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires a lowercase namespace; github.repository_owner preserves
      # case (e.g. "Erilla"), which would fail the push.
      - id: img
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: |
            ghcr.io/${{ steps.img.outputs.owner }}/seriouslycasualbot:latest
            ghcr.io/${{ steps.img.outputs.owner }}/seriouslycasualbot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-test:
    needs: [build, config]
    if: needs.config.outputs.test_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to test server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TEST_DEPLOY_HOST }}
          username: ${{ secrets.TEST_DEPLOY_USER }}
          key: ${{ secrets.TEST_DEPLOY_SSH_KEY }}
          script: |
            cd ~/seriouslycasualbot-test
            docker compose pull
            docker compose up -d
            docker image prune -f

  deploy-prod:
    needs: [build, config]
    if: needs.config.outputs.prod_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/seriouslycasualbot
            docker compose pull
            docker compose up -d
            docker image prune -f
