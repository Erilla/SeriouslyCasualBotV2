name: Release

on:
  push:
    branches: [prod]

permissions:
  contents: write

jobs:
  # Every step below soft-fails: Railway's Wait-for-CI watches ALL workflows
  # on the commit, so a hard failure here would silently skip the prod deploy.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: git-cliff walks the promoted range and the build
          # number is the commit count of HEAD.
          fetch-depth: 0
          # Nothing after checkout needs git credentials; gh uses GH_TOKEN.
          persist-credentials: false

      - name: Compute build number
        id: build
        run: echo "number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        continue-on-error: true
        env:
          RANGE: ${{ github.event.before }}..${{ github.event.after }}
        run: |
          # Recreated-branch guard: github.event.before can be all zeros,
          # which git-cliff can't resolve as a range endpoint.
          if [[ "$RANGE" =~ ^0+\.\. ]]; then
            RANGE="${RANGE#*..}"
          fi
          npx --yes git-cliff@2.13.1 --config cliff.toml "$RANGE" -o notes.md
          # Empty promotion range (e.g. re-push of the same SHA) must not fail.
          if [ -z "$(tr -d '[:space:]' < notes.md 2>/dev/null)" ]; then
            echo "No user-facing changes" > notes.md
          fi

      - name: Create GitHub release
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ steps.build.outputs.number }}
        run: |
          gh release create "build-$BUILD" \
            --target "$GITHUB_SHA" \
            --title "Build $BUILD" \
            --notes-file notes.md

      - name: Post to Discord
        # Every step in this workflow soft-fails: Railway's Wait-for-CI
        # watches ALL workflows on the commit, so a hard failure here would
        # silently skip the prod deploy.
        id: discord
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          BUILD: ${{ steps.build.outputs.number }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/build-${{ steps.build.outputs.number }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DISCORD_RELEASE_WEBHOOK not set; skipping Discord post"
            exit 0
          fi
          node -e '
            const fs = require("fs");
            let notes = fs.readFileSync("notes.md", "utf8").trim();
            const max = 4096;
            const suffix = `\n\n[Full notes](${process.env.RELEASE_URL})`;
            if (notes.length > max) {
              notes = notes.slice(0, max - suffix.length) + suffix;
            }
            const payload = {
              embeds: [{
                title: `🚀 Build ${process.env.BUILD} deployed to prod`,
                description: notes,
                url: process.env.RELEASE_URL,
                color: 0x57f287,
              }],
            };
            fs.writeFileSync("payload.json", JSON.stringify(payload));
          '
          curl -sS -f -H "Content-Type: application/json" -d @payload.json "$WEBHOOK_URL"

      - name: Warn on partial failure
        if: ${{ steps.notes.outcome == 'failure' || steps.release.outcome == 'failure' || steps.discord.outcome == 'failure' }}
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD: ${{ steps.build.outputs.number }}
        run: |
          echo "::warning::release workflow had step failures — notes: ${{ steps.notes.outcome }}, release: ${{ steps.release.outcome }}, discord: ${{ steps.discord.outcome }}"
          if [ -n "$WEBHOOK_URL" ]; then
            node -e '
              const payload = { content: `⚠️ Release workflow for build ${process.env.BUILD} had errors — check the run: ${process.env.RUN_URL}` };
              require("fs").writeFileSync("warn.json", JSON.stringify(payload));
            '
            curl -sS -f -H "Content-Type: application/json" -d @warn.json "$WEBHOOK_URL"
          fi
          exit 0
